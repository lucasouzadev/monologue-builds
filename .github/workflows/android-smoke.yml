name: Android emulator smoke (decrypted APK from a build run)
run-name: Android smoke @ build run ${{ inputs.build_run_id }}

# Manual only. Installs an APK produced by build.yml on an emulator and prints UI text + crash logs (no screenshots, no artifacts).
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run id of the build.yml run that produced monologue-android-<id>-1
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: monologue-android-${{ inputs.build_run_id }}-1
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Decrypt APK
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: node tools/decrypt-artifact.mjs apk/Monologue.apk.enc Monologue.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_atd
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/android-smoke/smoke.sh
