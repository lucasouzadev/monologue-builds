name: E2E Android (Maestro, emulator)
run-name: E2E Android @ build run ${{ inputs.build_run_id }}

# Manual. Installs the APK of a build.yml run and runs the Maestro flows in maestro/flows on an emulator.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run id of the build.yml run that produced monologue-android-<id>-1
        type: string
        required: true
      only:
        description: Optional space-separated baseline flow names; empty runs the full suite and audits
        type: string
        required: false
        default: ''
      profile:
        description: Optional device profile for the emulator (tall-gestures = 1080x2460, gesture navigation, like the owner's phone)
        type: string
        required: false
        default: ''
      appearance:
        description: Appearance for the baseline or targeted capture (full runs still execute all audits)
        type: choice
        required: false
        default: light
        options: [light, dark]
      motion:
        description: Keep existing harness settings, or explicitly verify normal/reduced animation behavior
        type: choice
        required: false
        default: existing
        options: [existing, normal, reduced]
      expected_update_id:
        description: Required OTA stamp prefix for this run; fails before later flows if another update was loaded
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # The light suite alone approached 110 min and prevented dark/large-text audits from finishing.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: monologue-android-${{ inputs.build_run_id }}-1
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Decrypt APK
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: node tools/decrypt-artifact.mjs apk/Monologue.apk.enc Monologue.apk "$ARTIFACT_PASSPHRASE"
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOW_ONLY: ${{ inputs.only }}
          DEVICE_PROFILE: ${{ inputs.profile }}
          QA_APPEARANCE: ${{ inputs.appearance }}
          QA_MOTION: ${{ inputs.motion }}
          EXPECTED_UPDATE_ID: ${{ inputs.expected_update_id }}
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 1536M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash maestro/android-e2e.sh

      # Metadata-only gate. A green report cannot replace inspecting the screenshots.
      - name: Fail closed on missing or damaged screenshot evidence
        if: always()
        run: |
          python3 maestro/quality-evidence.py --platform android ${{ inputs.only == '' && '--full' || '' }} --output maestro/maestro-quality-evidence.json
      - name: Retain per-run screenshot evidence and audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monologue-android-visual-qa-${{ github.run_id }}
          path: |
            maestro/maestro-quality-evidence.json
            maestro/flows/*.png
            maestro/shots/*.png
            maestro/audit-*/*.png
            maestro/stress/*.png
            maestro/stress-android/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish screenshots (test data only) to a screens branch
        if: always()
        run: |
          mkdir -p /tmp/shots
          cp maestro/flows/*.png maestro/audit-*/*.png maestro/stress-android/*.png maestro/shots/* /tmp/shots/ 2>/dev/null || true
          find ~/.maestro/tests -name "*.png" 2>/dev/null | while read -r f; do cp "$f" /tmp/shots/ 2>/dev/null || true; done
          cd /tmp/shots
          ls
          if [ -n "$(ls)" ]; then
            git init -q && git checkout -q -b screens-android
            git -c user.email=ci@example.invalid -c user.name=ci add . && git -c user.email=ci@example.invalid -c user.name=ci commit -q -m "screenshots android ${{ github.run_id }}"
            # Preserve evidence when another run later replaces the convenience branch.
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/screens-android-${{ github.run_id }}
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/screens-android
          fi
