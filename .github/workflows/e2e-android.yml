name: E2E Android (Maestro, emulator)
run-name: E2E Android @ build run ${{ inputs.build_run_id }}

# Manual. Installs the APK of a build.yml run and runs the Maestro flows in maestro/flows on an emulator.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run id of the build.yml run that produced monologue-android-<id>-1
        type: string
        required: true
      only:
        description: Optional space-separated baseline flow names; empty runs the full suite and audits
        type: string
        required: false
        default: ''
      profile:
        description: Optional device profile for the emulator (tall-gestures = 1080x2460, gesture navigation, like the owner's phone)
        type: string
        required: false
        default: ''
      appearance:
        description: Appearance for the baseline or targeted capture (full runs still execute all audits)
        type: choice
        required: false
        default: light
        options: [light, dark]
      motion:
        description: Keep existing harness settings, or explicitly verify normal/reduced animation behavior
        type: choice
        required: false
        default: existing
        options: [existing, normal, reduced]
      expected_update_id:
        description: Required OTA stamp prefix for this run; fails before later flows if another update was loaded
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # The light suite alone approached 110 min and prevented dark/large-text audits from finishing.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require private QA evidence encryption before running tests
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.M2_QA_EVIDENCE_PASSPHRASE }}
        run: node -e "if ((process.env.ARTIFACT_PASSPHRASE || '').length < 24) { console.error('A strong private QA evidence secret is required; existing APK keys are unchanged.'); process.exit(2); }"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: monologue-android-${{ inputs.build_run_id }}-1
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Decrypt APK
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: node tools/decrypt-artifact.mjs apk/Monologue.apk.enc Monologue.apk "$ARTIFACT_PASSPHRASE"
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOW_ONLY: ${{ inputs.only }}
          DEVICE_PROFILE: ${{ inputs.profile }}
          QA_APPEARANCE: ${{ inputs.appearance }}
          QA_MOTION: ${{ inputs.motion }}
          EXPECTED_UPDATE_ID: ${{ inputs.expected_update_id }}
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 1536M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # The action executes each script line in a separate shell. Fold the
          # entire conditional into one command; otherwise its first line fails.
          script: >-
            if bash maestro/android-e2e.sh > "$RUNNER_TEMP/monologue-maestro-android.log" 2>&1; then echo 'Maestro Android: PASS (details encrypted)'; else echo 'Maestro Android: FAIL (details encrypted)'; exit 1; fi

      # Content-free per-flow outcome (flow file names and PASS/FAIL only): lets an agent see WHICH acceptance flow failed without the encrypted evidence.
      - name: Per-flow results (names only)
        if: always()
        run: grep -E '^(RESULT|STEP) ' "$RUNNER_TEMP/monologue-maestro-android.log" || echo 'No per-flow results recorded.'
      # Metadata-only gate. A green report cannot replace inspecting the screenshots.
      - name: Fail closed on missing or damaged screenshot evidence
        if: always()
        run: |
          python3 maestro/quality-evidence.py --platform android ${{ inputs.only == '' && '--full' || '' }} --output maestro/maestro-quality-evidence.json
      # Public workflow: never upload plaintext UI, logs or screenshots.
      - name: Encrypt all visual QA and diagnostics before upload
        if: always()
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.M2_QA_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/private-qa"
          mkdir -p "$dir/data"
          if [ -f maestro/maestro-quality-evidence.json ]; then cp maestro/maestro-quality-evidence.json "$dir/data/"; fi
          find maestro/flows maestro/shots maestro/audit-* maestro/stress maestro/stress-android \
            -type f -name '*.png' -exec cp -- {} "$dir/data/" \; 2>/dev/null || true
          if [ -d "$HOME/.maestro/tests" ]; then
            find "$HOME/.maestro/tests" -type f -name '*.png' -exec cp -- {} "$dir/data/" \; 2>/dev/null || true
          fi
          if [ -d "$RUNNER_TEMP/qa-logs" ]; then cp "$RUNNER_TEMP/qa-logs/"*.log "$dir/data/" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/monologue-maestro-android.log" ]; then
            cp "$RUNNER_TEMP/monologue-maestro-android.log" "$dir/data/"
          fi
          test -f "$dir/data/maestro-quality-evidence.json" || {
            echo '::error::No audit manifest; no public plaintext fallback.'; exit 1;
          }
          tar -czf "$dir/visual-evidence.tgz" -C "$dir/data" .
          node tools/encrypt-visual-evidence.mjs "$dir/visual-evidence.tgz" "$GITHUB_WORKSPACE/visual-evidence.tgz.enc"
          rm -rf "$dir"
      - name: Publish encrypted visual evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monologue-android-encrypted-qa-${{ github.run_id }}
          path: visual-evidence.tgz.enc
          if-no-files-found: error
          retention-days: 7
