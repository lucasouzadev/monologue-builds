name: E2E Compasso (iOS simulator build + Maestro)
run-name: E2E Compasso @ ${{ inputs.source_ref }}

# Manual. Builds the Compasso app FOR THE SIMULATOR from the private source (no signing, no TestFlight, never an installable
# device build) and runs the Maestro flows in maestro/compasso/flows on an iOS simulator. Each run authorises one simulator build.
# Public workflow: only flow names and PASS/FAIL are printed; screenshots and logs are encrypted (SECURE_QA_ARTIFACTS.md).
on:
  workflow_dispatch:
    inputs:
      authorize_native_build:
        description: I authorize this iOS simulator build execution
        type: boolean
        required: true
        default: false
      source_ref:
        description: FULL SHA (or branch/tag) of the private lucasouzadev/monologue repository
        type: string
        required: true
        default: main
      only:
        description: Space-separated flow names to run (e.g. '00-launch 02-write-save-persist'); empty = all flows
        type: string
        required: false
        default: ''
      channel:
        description: EAS environment/channel embedded in the simulator build (development = the owner's stream)
        type: choice
        required: true
        default: development
        options: [development, preview]

permissions:
  contents: read

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
  # Compasso has no app extensions and ignores the Monologue baseline labels.
  MONOLOGUE_NATIVE_BASELINE: compasso
  MONOLOGUE_IOS_SHARE_EXTENSION: 'off'
  MONOLOGUE_IOS_WIDGET_EXTENSION: 'off'

jobs:
  e2e:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode_26.6.app/Contents/Developer' }}
    steps:
      - name: Require authorization for this execution
        run: test "${{ inputs.authorize_native_build }}" = true || { echo 'Explicit build authorization is required.'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: builds
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lucasouzadev/monologue
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: src
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - name: Require private QA evidence encryption before running tests
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.M2_QA_EVIDENCE_PASSPHRASE }}
        run: node -e "if ((process.env.ARTIFACT_PASSPHRASE || '').length < 24) { console.error('A strong private QA evidence secret is required.'); process.exit(2); }"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.8.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        working-directory: src
        run: pnpm install --frozen-lockfile
      - name: Run the app's own checks first (types, logic tests, native contract)
        working-directory: src
        run: |
          pnpm typecheck
          pnpm --filter @monologue/mobile test
          node scripts/validate-native-baseline.cjs
      - name: Restore a previous simulator build when native inputs are unchanged
        id: simcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sim/Compasso.tar.gz
          key: sim-compasso-${{ inputs.channel }}-${{ hashFiles('src/pnpm-lock.yaml', 'src/apps/mobile/modules/**', 'src/apps/mobile/app.config.*', 'src/apps/mobile/package.json') }}
      - name: Compile the app for the iOS simulator (EAS --local, no signing)
        id: compile
        if: steps.simcache.outputs.cache-hit != 'true'
        working-directory: src/apps/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/sim"
          eas build --local --platform ios --profile ${{ inputs.channel == 'preview' && 'github-simulator-staging' || 'github-simulator' }} --non-interactive --output "$RUNNER_TEMP/sim/Compasso.tar.gz"
      - name: Save the simulator build for reruns
        if: always() && steps.simcache.outputs.cache-hit != 'true' && steps.compile.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sim/Compasso.tar.gz
          key: ${{ steps.simcache.outputs.cache-primary-key }}
      - name: Boot a simulator and install the app
        id: simulator
        run: |
          tar -xzf "$RUNNER_TEMP/sim/Compasso.tar.gz" -C "$RUNNER_TEMP/sim"
          APP=$(find "$RUNNER_TEMP/sim" -maxdepth 2 -name '*.app' | head -1)
          echo "app: $APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name'] and x['isAvailable']]; print((c[-1] if c else {})['udid'])")
          echo "udid: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance light || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run Maestro flows
        env:
          FLOW_ONLY: ${{ inputs.only }}
        run: |
          mkdir -p "$RUNNER_TEMP/qa-logs"
          if FLOWS_DIR="$PWD/builds/maestro/compasso/flows" bash builds/maestro/run.sh "$SIM_UDID" > "$RUNNER_TEMP/qa-logs/compasso-flows.log" 2>&1; then
            echo 'Maestro Compasso: PASS (detailed evidence encrypted)'
            grep -aE '^(RESULT|STEP) ' "$RUNNER_TEMP/qa-logs/compasso-flows.log" || true
          else
            # Only the flow names and PASS/FAIL are public (no UI text, no screenshots).
            grep -aE '^(RESULT|STEP) ' "$RUNNER_TEMP/qa-logs/compasso-flows.log" || true
            echo 'Maestro Compasso: FAIL (detailed evidence encrypted)'; exit 1
          fi
      - name: Per-flow results (names only)
        if: always()
        run: grep -hE '^(RESULT|STEP) ' "$RUNNER_TEMP"/qa-logs/compasso-*.log 2>/dev/null || echo 'No per-flow results recorded.'
      # Public workflow: never upload plaintext UI, logs or screenshots.
      - name: Encrypt all visual QA and diagnostics before upload
        if: always()
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.M2_QA_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/private-qa"
          mkdir -p "$dir/data"
          find builds/maestro/shots -type f \( -name '*.png' -o -name '*.mp4' \) -exec cp -- {} "$dir/data/" \; 2>/dev/null || true
          if [ -d "$HOME/.maestro/tests" ]; then
            find "$HOME/.maestro/tests" -type f \( -name '*.png' -o -name '*.mp4' \) -exec cp -- {} "$dir/data/" \; 2>/dev/null || true
          fi
          if [ -d "$RUNNER_TEMP/qa-logs" ]; then cp "$RUNNER_TEMP/qa-logs/"*.log "$dir/data/" 2>/dev/null || true; fi
          tar -czf "$dir/visual-evidence.tgz" -C "$dir/data" .
          node builds/tools/encrypt-visual-evidence.mjs "$dir/visual-evidence.tgz" "$GITHUB_WORKSPACE/visual-evidence.tgz.enc"
          rm -rf "$dir"
      - name: Publish encrypted visual evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compasso-ios-encrypted-qa-${{ github.run_id }}
          path: visual-evidence.tgz.enc
          if-no-files-found: error
          retention-days: 7
