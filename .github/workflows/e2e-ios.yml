name: E2E iOS (simulator build + Maestro)
run-name: E2E iOS @ ${{ inputs.source_ref }}

# Manual. Builds the app FOR THE SIMULATOR from the private source (no signing, no TestFlight, never an installable device build)
# and runs the Maestro flows in maestro/flows on an iOS simulator. Each run authorises one simulator build.
on:
  workflow_dispatch:
    inputs:
      authorize_native_build:
        description: I authorize this iOS simulator build execution
        type: boolean
        required: true
        default: false
      cache_only:
        description: Reuse an existing simulator binary; fail before compilation if its cache is absent
        type: boolean
        required: false
        default: false
      source_ref:
        description: Branch, tag or SHA of the private lucasouzadev/monologue repository
        type: string
        required: true
        default: main
      native_baseline:
        description: Native baseline label embedded in the build
        type: choice
        required: true
        default: '18'
        options: ['19', '18', '17', '16', '15', '14', '13', '12', '11', '10', '09', '08', '07', '06']
      only:
        description: Verification subset — space-separated flow names (e.g. '00-warm-update 00b-build-stamp 01-create-open-send 15-conversation-panel 28-sheet-visuals'); empty = the full suite + audit + stress
        type: string
        required: false
        default: ''
      channel:
        description: development = the owner's devices' stream; preview = STAGING (validate a round here before it is promoted to development)
        type: choice
        required: true
        default: development
        options: [development, preview]
      appearance:
        description: Simulator appearance for the whole run (reference captures)
        type: choice
        required: false
        default: light
        options: [light, dark]
      reduce_transparency:
        description: Turn on Reduce Transparency (the app's no-Liquid fallback) for reference captures
        type: boolean
        required: false
        default: false
      expected_update_id:
        description: Required OTA stamp prefix; fail before later flows if another update was loaded
        type: string
        required: false
        default: ''
      testflight_build:
        description: Optional existing iOS build number to inspect in App Store Connect (read only)
        type: string
        required: false
        default: ''

permissions:
  contents: write

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  # The Maestro iOS driver (XCTest runner) can take longer than the 2 minute default to come up on a busy macOS runner.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
  MONOLOGUE_NATIVE_BASELINE: ${{ inputs.native_baseline }}
  # Simulator-only stress lab (burst sends, huge messages); never set for release or device builds.
  EXPO_PUBLIC_ENABLE_STRESS_LAB: '1'
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  e2e:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode_26.6.app/Contents/Developer' }}
    steps:
      - name: Require authorization for this execution
        run: test "${{ inputs.cache_only }}" = true || test "${{ inputs.authorize_native_build }}" = true || { echo 'Explicit build authorization is required.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: builds
      - uses: actions/checkout@v4
        with:
          repository: lucasouzadev/monologue
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: src
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - name: Require private QA evidence encryption before running tests
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.M2_QA_EVIDENCE_PASSPHRASE }}
        run: node -e "if ((process.env.ARTIFACT_PASSPHRASE || '').length < 24) { console.error('A strong private QA evidence secret is required; existing APK keys are unchanged.'); process.exit(2); }"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        working-directory: src
        run: pnpm install --frozen-lockfile
      - name: Restore a previous simulator build when native inputs are unchanged
        id: simcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sim/Monologue.tar.gz
          key: sim-stresslab-${{ inputs.channel }}-${{ inputs.native_baseline }}-${{ hashFiles('src/pnpm-lock.yaml', 'src/apps/mobile/modules/**', 'src/apps/mobile/app.config.*', 'src/apps/mobile/package.json') }}
      - name: Compile the app for the iOS simulator (EAS --local, no signing)
        id: compile
        if: steps.simcache.outputs.cache-hit != 'true'
        working-directory: src/apps/mobile
        run: |
          if [ "${{ inputs.cache_only }}" = true ]; then
            echo 'Requested cached binary is unavailable; no native compilation is authorized in cache-only mode.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sim"
          eas build --local --platform ios --profile ${{ inputs.channel == 'preview' && 'github-simulator-staging' || 'github-simulator' }} --non-interactive --output "$RUNNER_TEMP/sim/Monologue.tar.gz"
      - name: Save the simulator build for reruns
        if: always() && steps.simcache.outputs.cache-hit != 'true' && steps.compile.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sim/Monologue.tar.gz
          key: ${{ steps.simcache.outputs.cache-primary-key }}
      - name: Boot a simulator and install the app
        id: simulator
        run: |
          tar -xzf "$RUNNER_TEMP/sim/Monologue.tar.gz" -C "$RUNNER_TEMP/sim"
          APP=$(find "$RUNNER_TEMP/sim" -maxdepth 2 -name '*.app' | head -1)
          echo "app: $APP"
          xcrun simctl list devices available | grep -i iphone | head -5
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name'] and x['isAvailable']]; print((c[-1] if c else {})['udid'])")
          echo "udid: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance "${{ inputs.appearance }}" || true
          # Tiny generated photos (like Android's), then the short video last so it is the newest item.
          python3 builds/maestro/make-photo-fixtures.py
          for i in 1 2 3 4; do xcrun simctl addmedia "$UDID" /tmp/fx$i.png || true; done
          xcrun simctl addmedia "$UDID" builds/maestro/fixtures/clip.mp4 || true
          if [ "${{ inputs.reduce_transparency }}" = true ]; then
            xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceTransparencyEnabled -bool true || true
            xcrun simctl spawn "$UDID" defaults write com.apple.universalaccess reduceTransparency -bool true || true
            xcrun simctl shutdown "$UDID" && xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
            xcrun simctl ui "$UDID" appearance "${{ inputs.appearance }}" || true
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run Maestro flows
        env:
          FLOW_ONLY: ${{ inputs.only }}
          EXPECTED_UPDATE_ID: ${{ inputs.expected_update_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/qa-logs"
          if bash builds/maestro/run.sh "$SIM_UDID" > "$RUNNER_TEMP/qa-logs/ios-flows.log" 2>&1; then
            echo 'Maestro iOS: PASS (detailed evidence encrypted)'
          else
            echo 'Maestro iOS: FAIL (detailed evidence encrypted)'; exit 1
          fi

      # Content-free per-flow outcome (flow file names and PASS/FAIL only).
      - name: Per-flow results (names only)
        if: always()
        run: grep -hE '^RESULT ' "$RUNNER_TEMP"/qa-logs/ios-*.log 2>/dev/null || echo 'No per-flow results recorded.'

      - name: Audit passes (dark, large text, huge text)
        if: always() && steps.simulator.outcome == 'success' && inputs.only == ''
        timeout-minutes: 100
        run: |
          mkdir -p "$RUNNER_TEMP/qa-logs"
          if bash builds/maestro/audit-passes.sh ios "$SIM_UDID" > "$RUNNER_TEMP/qa-logs/ios-audit.log" 2>&1; then
            echo 'Maestro iOS visual audit: PASS (screenshots still require private review)'
          else
            echo 'Maestro iOS visual audit: FAIL (details encrypted)'; exit 1
          fi

      - name: Run the stress flow (burst sends, 100k-char messages, Reply Focus, history scroll)
        if: always() && steps.simulator.outcome == 'success' && inputs.only == ''
        timeout-minutes: 40
        run: |
          mkdir -p "$RUNNER_TEMP/qa-logs"
          if FLOWS_DIR="$PWD/builds/maestro/stress" SHOT_PREFIX=stress- FLOW_TIMEOUT=420 bash builds/maestro/run.sh "$SIM_UDID" > "$RUNNER_TEMP/qa-logs/ios-stress.log" 2>&1; then
            echo 'Maestro iOS stress: PASS'
          else
            echo 'Maestro iOS stress: FAIL (details encrypted)'; exit 1
          fi

      # Metadata-only gate. A green report cannot replace inspecting the screenshots.
      - name: Read existing TestFlight build readiness (no upload or distribution)
        if: always() && inputs.testflight_build != ''
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          TESTFLIGHT_BUILD: ${{ inputs.testflight_build }}
        run: node builds/maestro/testflight-status.cjs "$TESTFLIGHT_BUILD"
      - name: Retain TestFlight readiness receipt
        if: always() && inputs.testflight_build != ''
        uses: actions/upload-artifact@v4
        with:
          name: monologue-testflight-status-${{ github.run_id }}
          path: testflight-status.json
          if-no-files-found: error

      - name: Fail closed on missing or damaged screenshot evidence
        if: always()
        run: |
          python3 builds/maestro/quality-evidence.py --platform ios ${{ inputs.only == '' && '--full' || '' }} --output builds/maestro/maestro-quality-evidence.json
      # Public workflow: never upload plaintext UI, logs or screenshots.
      - name: Encrypt all visual QA and diagnostics before upload
        if: always()
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.M2_QA_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/private-qa"
          mkdir -p "$dir/data"
          if [ -f builds/maestro/maestro-quality-evidence.json ]; then cp builds/maestro/maestro-quality-evidence.json "$dir/data/"; fi
          find builds/maestro/flows builds/maestro/shots builds/maestro/audit-* builds/maestro/stress builds/maestro/stress-android \
            -type f -name '*.png' -exec cp -- {} "$dir/data/" \; 2>/dev/null || true
          if [ -d "$HOME/.maestro/tests" ]; then
            find "$HOME/.maestro/tests" -type f -name '*.png' -exec cp -- {} "$dir/data/" \; 2>/dev/null || true
          fi
          if [ -d "$RUNNER_TEMP/qa-logs" ]; then cp "$RUNNER_TEMP/qa-logs/"*.log "$dir/data/" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/monologue-maestro-android.log" ]; then
            cp "$RUNNER_TEMP/monologue-maestro-android.log" "$dir/data/"
          fi
          test -f "$dir/data/maestro-quality-evidence.json" || {
            echo '::error::No audit manifest; no public plaintext fallback.'; exit 1;
          }
          tar -czf "$dir/visual-evidence.tgz" -C "$dir/data" .
          node builds/tools/encrypt-visual-evidence.mjs "$dir/visual-evidence.tgz" "$GITHUB_WORKSPACE/visual-evidence.tgz.enc"
          rm -rf "$dir"
      - name: Publish encrypted visual evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monologue-ios-encrypted-qa-${{ github.run_id }}
          path: visual-evidence.tgz.enc
          if-no-files-found: error
          retention-days: 7
