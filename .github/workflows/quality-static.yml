name: Validate Maestro quality tooling (no native build)

on:
  pull_request:
    paths:
      - 'maestro/**'
      - '.github/workflows/e2e-android.yml'
      - '.github/workflows/e2e-ios.yml'
      - '.github/workflows/quality-static.yml'
  push:
    branches: [main]
    paths:
      - 'maestro/**'
      - '.github/workflows/quality-static.yml'

permissions:
  contents: read

jobs:
  maestro-static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shell and Python syntax
        run: |
          bash -n maestro/run.sh maestro/audit-passes.sh maestro/android-e2e.sh
          python3 -m py_compile maestro/quality-evidence.py
          node --check tools/encrypt-visual-evidence.mjs
          node --check tools/decrypt-visual-evidence.mjs
          node --check tools/check-public-e2e-privacy.mjs
          node tools/check-public-e2e-privacy.mjs
      - name: Quality gate self-test (including negative fixtures)
        run: python3 maestro/quality-evidence.py --self-test
      - name: Validate Maestro and GitHub workflow YAML syntax
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-yaml"
          "$RUNNER_TEMP/quality-yaml/bin/pip" install --disable-pip-version-check PyYAML==6.0.2
          "$RUNNER_TEMP/quality-yaml/bin/python" - <<'PY'
          from pathlib import Path
          import yaml
          files = list(Path('maestro/flows').rglob('*.yaml'))
          files += list(Path('.github/workflows').glob('*.yml'))
          for file in files:
              with file.open(encoding='utf-8') as stream:
                  docs = list(yaml.safe_load_all(stream))
              if not docs or all(doc is None for doc in docs):
                  raise SystemExit(f'Empty YAML: {file}')
          print(f'PASS {len(files)} YAML files')
          PY
      - name: Authenticated encryption round-trip and tamper rejection (synthetic only)
        run: |
          set -euo pipefail
          printf 'synthetic visual audit fixture; no private files' > "$RUNNER_TEMP/fixture.txt"
          export ARTIFACT_PASSPHRASE="$(openssl rand -hex 32)"
          node tools/encrypt-visual-evidence.mjs "$RUNNER_TEMP/fixture.txt" "$RUNNER_TEMP/fixture.enc"
          node tools/decrypt-visual-evidence.mjs "$RUNNER_TEMP/fixture.enc" "$RUNNER_TEMP/fixture.out"
          cmp "$RUNNER_TEMP/fixture.txt" "$RUNNER_TEMP/fixture.out"
          python3 -c "from pathlib import Path; p=Path('$RUNNER_TEMP/fixture.enc'); b=bytearray(p.read_bytes()); b[-1] ^= 1; p.write_bytes(b)"
          if node tools/decrypt-visual-evidence.mjs "$RUNNER_TEMP/fixture.enc" "$RUNNER_TEMP/tampered.out"; then
            echo '::error::Tampered archive was unexpectedly accepted'; exit 1
          fi
          test ! -f "$RUNNER_TEMP/tampered.out"
