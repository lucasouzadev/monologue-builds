# Search finds what was written (02 wrote "Primeira E2E" on this simulator).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Hoje"
    timeout: 30000
- tapOn: "Buscar no diário"
- extendedWaitUntil:
    visible: "Texto para buscar"
    timeout: 10000
- tapOn: "Texto para buscar"
- inputText: "Primeira"
- extendedWaitUntil:
    visible: ".*Primeira E2E.*"
    timeout: 15000
- takeScreenshot: 04-search-result
