# Home parity, part 3 (after 20 and 21, same data): the thread line, pinning (the chip under the header), the
# multi-select mode, deleting and the notice. Screenshots at each state.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Hoje"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ".*resposta.*"
    direction: DOWN
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-thread-line
- longPressOn: "comprar pao"
- waitForAnimationToEnd
- tapOn: "Organizar"
- waitForAnimationToEnd
- takeScreenshot: 22-organize
- tapOn: "Fixar"
- waitForAnimationToEnd
- swipe:
    start: "50%,30%"
    end: "50%,80%"
- waitForAnimationToEnd
- takeScreenshot: 22-pinned
# Pinned: "comprar pao" is now also the chip under the header; the message is the second match.
- longPressOn:
    text: "comprar pao"
    index: 1
- waitForAnimationToEnd
- tapOn: "Organizar"
- tapOn:
    text: "Selecionar mensagens"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-selecting
- tapOn:
    text: ".*example.com.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-selected-two
- tapOn:
    text: "Excluir entradas selecionadas"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-confirm
- tapOn:
    text: "Excluir"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-deleted
