# Home parity, part 3 (seeds its own data): the thread line, pinning (the chip under the header), the
# multi-select mode, deleting and the notice. Screenshots at each state.
appId: app.monologue.mobile
---
- runFlow: support/seed-home.yaml
- scrollUntilVisible:
    element:
      text: ".*resposta.*"
    direction: DOWN
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-thread-line
- longPressOn: ".*mais longa.*"
- waitForAnimationToEnd
- takeScreenshot: 22-organize
# Fixar is a quick action on top of the menu (owner 17/11).
- tapOn: "Fixar"
- waitForAnimationToEnd
- swipe:
    start: "50%,30%"
    end: "50%,80%"
- waitForAnimationToEnd
- takeScreenshot: 22-pinned
# Pinned: "comprar pao" is now also the chip under the header; the message is the second match.
- longPressOn:
    text: ".*Oi.*"
    index: 0
- waitForAnimationToEnd
- tapOn: "Organizar"
- tapOn:
    text: "Selecionar mensagens"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-selecting
- tapOn:
    text: ".*example.com.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-selected-two
- tapOn:
    text: "Excluir entradas selecionadas"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-confirm
- tapOn:
    text: "Excluir"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 22-deleted
