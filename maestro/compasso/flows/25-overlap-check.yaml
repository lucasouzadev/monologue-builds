# Overlap check (QA native-12 follow-up, 18/11): same data as 20 and 21. Screenshots of the page before and after
# pinning, after scrolling both ways, and with "Selecionar texto" open, to see whether rows overlap or get cut.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Hoje"
    timeout: 60000
- takeScreenshot: 25-before
- scrollUntilVisible:
    element:
      text: ".*mais longa.*"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 25-before-pin
- longPressOn: ".*mais longa.*"
- waitForAnimationToEnd
- tapOn: "Fixar"
- waitForAnimationToEnd
- takeScreenshot: 25-after-pin
# A second menu right after an action: does it open again, on the same message, without scrolling?
- longPressOn: ".*mais longa.*"
- waitForAnimationToEnd
- takeScreenshot: 25-menu-second
- tapOn:
    point: "50%,12%"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 25-menu-closed
- swipe:
    start: "50%,70%"
    end: "50%,25%"
- waitForAnimationToEnd
- takeScreenshot: 25-scrolled-down
- swipe:
    start: "50%,30%"
    end: "50%,80%"
- waitForAnimationToEnd
- takeScreenshot: 25-scrolled-up
- scrollUntilVisible:
    element:
      text: ".*mais longa.*"
    direction: DOWN
    timeout: 20000
    optional: true
- longPressOn: ".*mais longa.*"
- waitForAnimationToEnd
- takeScreenshot: 25-menu-after-scroll
- waitForAnimationToEnd
- tapOn: "Escrever"
- tapOn: "Selecionar texto"
- waitForAnimationToEnd
- takeScreenshot: 25-text-select
- tapOn: "Sair da seleção de texto"
- waitForAnimationToEnd
- takeScreenshot: 25-after-select
