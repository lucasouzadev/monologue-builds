# First launch downloads the newest OTA; it is applied on the NEXT launch. Wait, then stop so flow 01+ run the current JS.
appId: app.monologue.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Monologue"
    timeout: 90000
- extendedWaitUntil:
    notVisible: "__sleep__"
    timeout: 25000
- stopApp
