# First launch downloads the newest OTA. run.sh leaves the app running for the
# download window, then terminates it before 00b checks the NEXT launch.
appId: app.monologue.mobile
---
- launchApp:
    clearState: true
- retry:
    maxRetries: 3
    commands:
      # Retry a slow first launch without clearing downloaded updates again.
      - launchApp
      - extendedWaitUntil:
          visible: "Monologue"
          timeout: 30000
