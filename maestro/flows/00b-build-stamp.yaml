# GATE CHECK (mandatory, runs first): which JS is this build really running? The drawer prints "<channel> · <update id> · <time>Z" or
# "<channel> · embedded" (= NO update was applied: the E2E would be testing the old embedded bundle, so every later result is void).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Monologue"
    timeout: 60000
- extendedWaitUntil:
    visible: "Monologue"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      # The Home header is a SwiftUI control; its accessibility label is not always in the tree right after launch/return, so open by position.
      - tapOn:
          point: "88%,9%"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Open personal space"
- extendedWaitUntil:
    visible:
      id: "build-stamp"
    timeout: 20000
- takeScreenshot: 00b-build-stamp
- assertNotVisible: ".*embedded.*"
