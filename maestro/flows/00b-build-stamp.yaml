# GATE CHECK (mandatory, runs first): which JS is this build really running? The drawer prints "<channel> · <update id> · <time>Z" or
# "<channel> · embedded" (= NO update was applied: the E2E would be testing the old embedded bundle, so every later result is void).
appId: app.monologue.mobile
---
- launchApp:
    # Inspect the JS that is running now. Another cold restart here could hide a
    # previous flow's rollback and unnecessarily restarts the app twice per flow.
    stopApp: false
- openLink: "monologue:///"
- extendedWaitUntil:
    visible: "Open in.*Monologue.*"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible: "Open in.*Monologue.*"
    commands:
      - tapOn: "Open"
# A fresh install on a production-like channel (testers) opens the introduction (staging skips it). Leave it through its own Skip so every
# later flow starts on Home, then return to Home by link (Skip lands in the new chat).
- runFlow:
    when:
      visible:
        id: "intro-skip"
    commands:
      - tapOn:
          id: "intro-skip"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 30000
      - openLink: "monologue:///"
- extendedWaitUntil:
    visible: "Monologue"
    timeout: 60000
- extendedWaitUntil:
    visible: "Monologue"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      # The Home header is a SwiftUI control; its accessibility label is not always in the tree right after launch/return, so open by
      # position — and retry: the first tap can land before the header is interactive.
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  visible: "Open personal space"
                commands:
                  - tapOn: "Open personal space"
            - runFlow:
                when:
                  notVisible: "Settings.*"
                commands:
                  # Current main moved attribution into the status area. The
                  # inspected header button centre is now at 9%, not 12%.
                  - tapOn:
                      point: "88%,9%"
            - extendedWaitUntil:
                visible: "Settings.*"
                timeout: 6000
      - scrollUntilVisible:
          element:
            id: "build-stamp"
          timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Open personal space"
      - scrollUntilVisible:
          element:
            id: "build-stamp"
          timeout: 20000
- takeScreenshot: 00b-build-stamp
# MAESTRO_EXPECTED_UPDATE_ID=embedded: the simulator binary was compiled from the very source under test, so the embedded bundle IS that JS.
- runFlow:
    when:
      true: ${MAESTRO_EXPECTED_UPDATE_ID != 'embedded'}
    commands:
      - assertNotVisible: ".*embedded.*"
- runFlow:
    when:
      true: ${MAESTRO_EXPECTED_UPDATE_ID != null && MAESTRO_EXPECTED_UPDATE_ID.length > 0}
    commands:
      - assertVisible: ${".*" + MAESTRO_EXPECTED_UPDATE_ID + ".*"}
