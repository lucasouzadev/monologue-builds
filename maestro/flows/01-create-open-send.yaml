# The core path the owner could not complete on Android: create a conversation, open it, write and send a message.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "New conversation"
    timeout: 60000
- tapOn: "New conversation"
- takeScreenshot: 01-new-conversation-sheet
- extendedWaitUntil:
    visible: ".*(First note|Write your first note).*"
    timeout: 15000
- tapOn: ".*(First note|Write your first note).*"
- inputText: "Teste"
- takeScreenshot: 01-sheet-typed
- extendedWaitUntil:
    visible: "Create conversation"
    timeout: 8000
- tapOn: "Create conversation"
- extendedWaitUntil:
    visible: ".*Teste.*"
    timeout: 20000
- takeScreenshot: 01-home-with-conversation
- tapOn: ".*Teste.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Message.*"
- inputText: "Ola"
- tapOn: "Send message"
- assertVisible: ".*Ola.*"
- takeScreenshot: 01-conversation-sent
