# Header and entry controls on Home (the buttons that did nothing on the Android build).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- extendedWaitUntil:
    visible: "Activity"
    timeout: 10000
- takeScreenshot: 02-drawer
- tapOn: "Close personal space"
- extendedWaitUntil:
    visible: "More creation options"
    timeout: 10000
- tapOn: "More creation options"
- assertVisible: "Wide search"
- takeScreenshot: 02-options-tray
- tapOn: "Wide search"
- assertVisible: "Search"
- takeScreenshot: 02-wide-search
