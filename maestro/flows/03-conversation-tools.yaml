# Inside a conversation: calendar reveal open, gesture close, button close, options menu (the app stopped after this on the owner's Android).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Dates of messages"
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000
- takeScreenshot: 03-calendar-reveal
# Android: the compact month/year picker (replaces the full-screen Material date dialog).
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: ".*Choose month and year.*"
          optional: true
      - takeScreenshot: 03-month-picker
      - tapOn:
          text: "Dec"
          optional: true
      - takeScreenshot: 03-month-chosen
# Close by dragging the lifted conversation card back up (the gesture the owner could not use on Android).
- swipe:
    start: "50%,62%"
    end: "50%,12%"
    duration: 400
- takeScreenshot: 03-calendar-after-swipe
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 10000
# Reopen and close with the button as well.
- tapOn: "Dates of messages"
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000
- tapOn: "Close dates of messages"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 10000
- tapOn: "Conversation options"
- assertVisible: "Rename"
- takeScreenshot: 03-options-menu
