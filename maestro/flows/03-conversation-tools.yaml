# Inside a conversation: the info Reveal opens (button, title), closes by the gesture, and the options menu still opens (the app stopped after this on the owner's Android).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Conversation info"
- extendedWaitUntil:
    visible:
      id: "conversation-info-title"
    timeout: 10000
- takeScreenshot: 03-info-reveal
# Close by dragging the lifted conversation card back up (the gesture the owner could not use on Android).
- swipe:
    start: "50%,62%"
    end: "50%,12%"
    duration: 400
- takeScreenshot: 03-info-after-swipe
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 10000
# The title opens the same Reveal.
- tapOn:
    id: "conversation-title-button"
- extendedWaitUntil:
    visible:
      id: "conversation-info-title"
    timeout: 10000
- swipe:
    start: "50%,62%"
    end: "50%,12%"
    duration: 400
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 10000
- tapOn: "Conversation options"
- assertVisible: "Rename"
- takeScreenshot: 03-options-menu
