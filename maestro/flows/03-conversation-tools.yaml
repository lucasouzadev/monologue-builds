# Inside a conversation: calendar reveal open, gesture close, button close, options menu (the app stopped after this on the owner's Android).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Untitled, .*"
    timeout: 60000
- tapOn: "Untitled, .*"
- extendedWaitUntil:
    visible: "Message"
    timeout: 20000
- tapOn: "Dates of messages"
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000
- takeScreenshot: 03-calendar-reveal
# Close by dragging the lifted conversation card back up (the gesture the owner could not use on Android).
- swipe:
    start: "50%,92%"
    end: "50%,45%"
    duration: 400
- takeScreenshot: 03-calendar-after-swipe
- extendedWaitUntil:
    visible: "Message"
    timeout: 10000
# Reopen and close with the button as well.
- tapOn: "Dates of messages"
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000
- tapOn: "Close dates of messages"
- extendedWaitUntil:
    visible: "Message"
    timeout: 10000
- tapOn: "Conversation options"
- assertVisible: "Rename"
- takeScreenshot: 03-options-menu
