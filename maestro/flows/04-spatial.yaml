# Spatial overview (opened from the Home options tray, "Timeline").
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "More creation options"
    timeout: 60000
- tapOn: "More creation options"
- tapOn: "Timeline"
- extendedWaitUntil:
    visible: "Close conversation previews"
    timeout: 10000
- takeScreenshot: 04-spatial
# Footer Duplicate (red) copies the selected conversation and the deck moves to the copy; "+" does the same for a new one.
- tapOn:
    id: "spatial-duplicate"
    optional: true
- takeScreenshot: 04-spatial-duplicated
- tapOn:
    id: "spatial-create"
    optional: true
- takeScreenshot: 04-spatial-created
- tapOn: "Close conversation previews"
