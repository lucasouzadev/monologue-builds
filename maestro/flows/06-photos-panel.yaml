# The Photos panel inside the composer "+" menu: selecting an image closed the app on the owner's Android.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Tools.*"
- extendedWaitUntil:
    visible: "Expand editor"
    timeout: 10000
- tapOn: "Photos"
- takeScreenshot: 06-gallery
- tapOn:
    point: "20%,47%"
- takeScreenshot: 06-image-selected
- tapOn:
    point: "55%,47%"
- takeScreenshot: 06-two-selected
# Import the selection (the check button at the panel's lower right): this is where the owner's app closed.
- tapOn:
    point: "86%,90%"
- takeScreenshot: 06-after-import
- assertVisible:
    text: ".*(Message|Tools).*"
    optional: true
- takeScreenshot: 06-end
