# Home list: filter menu, long-press preview (with actions), row menu, selection mode.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- takeScreenshot: 07-home
- tapOn:
    text: "Filter conversations.*"
    optional: true
- takeScreenshot: 07-filter-menu
- tapOn:
    text: "All"
    optional: true
- longPressOn: ".*Ola.*"
- takeScreenshot: 07-long-press-preview
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Done"
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- tapOn:
    text: "Options for .*"
    optional: true
- takeScreenshot: 07-row-menu
- pressKey: back
- takeScreenshot: 07-end
