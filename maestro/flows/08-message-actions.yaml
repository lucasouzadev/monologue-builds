# Conversation: message long-press menu, reply focus mode, return to the header.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- longPressOn: ".*Ola.*"
- takeScreenshot: 08-message-menu
- tapOn:
    text: "Reply"
    optional: true
- takeScreenshot: 08-reply-focus
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Done|Close.*"
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- takeScreenshot: 08-after-reply-header
- assertVisible: "Back"
