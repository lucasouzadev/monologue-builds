# Round 6b · 2.1 — text written in the Composer goes into Reply Focus with the person (moved, not copied) and comes back to the Composer when the Focus is left unsent.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "R6bCarry"
- tapOn: "Message.*"
- inputText: "Carry me along"
- hideKeyboard
- retry:
    maxRetries: 3
    commands:
      - longPressOn: ".*QA root.*"
      - runFlow:
          when:
            platform: iOS
          commands:
            - runFlow:
                when:
                  notVisible: "Write.*"
                commands:
                  - longPressOn:
                      point: "82%,83%"
      - extendedWaitUntil:
          visible: "Write.*"
          timeout: 5000
- tapOn: "Write.*"
- tapOn: "Reply"
- extendedWaitUntil:
    visible:
      id: thought-focus-close
    timeout: 8000
- extendedWaitUntil:
    visible: ".*Carry me along.*"
    timeout: 5000
- takeScreenshot: 100-carried-into-focus
- hideKeyboard
- tapOn:
    id: thought-focus-close
- extendedWaitUntil:
    notVisible:
      id: thought-focus-close
    timeout: 6000
- extendedWaitUntil:
    visible: ".*Carry me along.*"
    timeout: 5000
- takeScreenshot: 100-back-in-compose
