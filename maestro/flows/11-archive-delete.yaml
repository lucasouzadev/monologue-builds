# Archive, the Archived filter, row menu, unarchive (delete selection + Back verified separately).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn:
    text: "Options for .*"
    optional: true
- tapOn:
    text: "Archive"
    optional: true
- takeScreenshot: 11-after-archive
- tapOn:
    text: "Filter conversations.*"
    optional: true
- tapOn:
    text: "Archived"
    optional: true
- takeScreenshot: 11-archived-filter
- tapOn:
    text: "Options for .*"
    optional: true
- takeScreenshot: 11-archived-row-menu
- tapOn:
    text: "Unarchive"
    optional: true
- takeScreenshot: 11-after-unarchive
- pressKey: back
- takeScreenshot: 11-end
