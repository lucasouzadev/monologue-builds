# Merge reveal from the message menu, then Home search results with chips.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- longPressOn: ".*Ola.*"
- tapOn:
    text: "Merge"
    optional: true
- takeScreenshot: 13-merge-reveal
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Cancel selection"
          optional: true
      - tapOn:
          text: "Back"
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
      - pressKey: back
- extendedWaitUntil:
    visible: "Search.*"
    timeout: 20000
- tapOn: "Search.*"
- inputText: "Ola"
- takeScreenshot: 13-search-typed
- hideKeyboard
- takeScreenshot: 13-search-results
- tapOn:
    text: "Archived"
    optional: true
- takeScreenshot: 13-search-archived
