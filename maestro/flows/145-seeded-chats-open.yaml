# Perf round: realistic content. Seeds 10 chats x 300 messages (text, long, formatted, tasks, links, Reply, Continue, Merge) through the real commands, then opens five of
# them twice. The numbers come from the tx_* log (chat_open_total: frames/jank/worst/r_home_row/r_message_cell), the screenshots are the visual check.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- scrollUntilVisible:
    element:
      id: "profile-seed"
    timeout: 20000
- tapOn:
    id: "profile-seed"
- extendedWaitUntil:
    visible: "SEED DONE.*"
    timeout: 600000
- takeScreenshot: 145-seed-report
- tapOn:
    id: "seed-home"
- extendedWaitUntil:
    visible: ".*Tarefas.*"
    timeout: 30000
- takeScreenshot: 145-home-seeded
- repeat:
    times: 2
    commands:
      - tapOn: ".*Tarefas.*"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 20000
      - takeScreenshot: 145-chat-tarefas
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*Ideias.*"
          timeout: 20000
      - tapOn: ".*Ideias.*"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 20000
      - takeScreenshot: 145-chat-ideias
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*Projetos.*"
          timeout: 20000
      - tapOn: ".*Projetos.*"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 20000
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*Leituras.*"
          timeout: 20000
      - tapOn: ".*Leituras.*"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 20000
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*Tarefas.*"
          timeout: 20000
