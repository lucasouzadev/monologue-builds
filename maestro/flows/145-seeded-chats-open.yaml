# Perf round: realistic content. Seeds 10 chats x 300 messages (text, long, formatted, tasks, links, Reply, Continue, Merge) through the real commands, then opens five of
# them twice (newest first: Finanças, Receitas, Estudos, Casa). The numbers come from the tx_* log (chat_open_total: frames/jank/worst/r_home_row/r_message_cell), the screenshots are the visual check.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- scrollUntilVisible:
    element:
      id: "profile-seed"
    timeout: 20000
- tapOn:
    id: "profile-seed"
- extendedWaitUntil:
    visible: "SEED DONE.*"
    timeout: 600000
- takeScreenshot: 145-seed-report
- tapOn:
    id: "seed-home"
- extendedWaitUntil:
    visible: ".*Finan.*"
    timeout: 30000
- takeScreenshot: 145-home-seeded
- repeat:
    times: 2
    commands:
      - tapOn: ".*Finan.*"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 20000
      - takeScreenshot: 145-chat-1
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*Receitas.*"
          timeout: 20000
      - tapOn: ".*Receitas.*"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 20000
      - takeScreenshot: 145-chat-2
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*Estudos.*"
          timeout: 20000
      - tapOn: ".*Estudos.*"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 20000
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*Casa.*"
          timeout: 20000
      - tapOn: ".*Casa.*"
      - extendedWaitUntil:
          visible: "Message.*"
          timeout: 20000
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: ".*Finan.*"
          timeout: 20000
