# Perf round diagnosis: after opening a seeded chat WITH photos, which of these are on screen? Each `assertNotVisible` that is false prints a "Warning: Assertion is false" line
# (the public RESULT/STEP log keeps the first three), so the first visible ones identify the screen without a readable screenshot.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- scrollUntilVisible:
    element:
      id: "profile-seed-media-small"
    timeout: 20000
- tapOn:
    id: "profile-seed-media-small"
- extendedWaitUntil:
    visible: "SEED DONE.*images=[1-9].*"
    timeout: 600000
- tapOn:
    id: "seed-home"
- extendedWaitUntil:
    visible: ".*Projetos.*"
    timeout: 30000
- tapOn: ".*Projetos.*"
- extendedWaitUntil:
    visible: "never-visible-sentinel"
    timeout: 6000
    optional: true
- assertNotVisible:
    text: "Open personal space"
    optional: true
- assertNotVisible:
    text: ".*Ideias.*"
    optional: true
- assertNotVisible:
    text: "Message.*"
    optional: true
- assertNotVisible:
    text: ".*Mostrar.*"
    optional: true
- assertNotVisible:
    text: "Close.*"
    optional: true
- assertNotVisible:
    text: "Done"
    optional: true
- assertNotVisible:
    text: "Back"
    optional: true
# The runner prints diagnostic lines only for a FAILED flow: fail on purpose so the warnings above are kept.
- assertVisible: "zzz-diagnosis-end"
