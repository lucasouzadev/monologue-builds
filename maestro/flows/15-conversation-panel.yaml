# The conversation panel: a full page behind the chat header (avatar, title, tab cards, one panel per tab). Read-only: it never
# changes the shared state the other flows rely on.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn:
    id: "conversation-title-button"
- extendedWaitUntil:
    visible:
      id: "panel-details"
    timeout: 15000
- takeScreenshot: 15-panel
- tapOn:
    id: "panel-open-pinned"
- takeScreenshot: 15-pinned-sheet
- swipe:
    direction: DOWN
- tapOn:
    id: "panel-open-favorites"
- takeScreenshot: 15-favorites-sheet
- swipe:
    direction: DOWN
- tapOn:
    id: "panel-back"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 15000
