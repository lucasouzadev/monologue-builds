# The conversation Reveal (info button, title or pull-down): page 1 info + Search/Favorites/Pinned/Share, then Favorites and Pinned pages with dots.
# Read-only: it never changes the shared state the other flows rely on.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Conversation info"
- extendedWaitUntil:
    visible:
      id: "conversation-info-title"
    timeout: 15000
- takeScreenshot: 15-info
- tapOn:
    id: "info-pinned"
- takeScreenshot: 15-pinned-page
- tapOn:
    id: "pinned-back"
- tapOn:
    id: "info-favorites"
- takeScreenshot: 15-favorites-page
- tapOn:
    id: "favorites-back"
- swipe:
    direction: UP
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 15000
