# The conversation panel: a full page behind the chat header (avatar, title, tab cards, one panel per tab). Read-only: it never
# changes the shared state the other flows rely on.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn:
    id: "conversation-title-button"
- extendedWaitUntil:
    visible:
      id: "panel-tab-details"
    timeout: 15000
- takeScreenshot: 15-panel-first-tab
- tapOn:
    id: "panel-tab-pins"
- takeScreenshot: 15-panel-pins
- tapOn:
    id: "panel-tab-favorites"
- takeScreenshot: 15-panel-favorites
- tapOn:
    id: "panel-tab-details"
- takeScreenshot: 15-panel-details
- tapOn:
    id: "panel-back"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 15000
