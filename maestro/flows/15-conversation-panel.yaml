# The conversation panel: a sheet over the chat (avatar, title, four actions, Details/Media pills; Pinned and Favorites replace its content). Read-only: it never
# changes the shared state the other flows rely on.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn:
    id: "conversation-title-button"
- extendedWaitUntil:
    visible:
      id: "panel-details"
    timeout: 15000
- takeScreenshot: 15-panel
- tapOn:
    id: "panel-open-pinned"
- takeScreenshot: 15-pinned-page
- tapOn:
    id: "marks-back"
- tapOn:
    id: "panel-open-favorites"
- takeScreenshot: 15-favorites-page
- tapOn:
    id: "marks-back"
- tapOn:
    id: "panel-tab-media"
- takeScreenshot: 15-panel-media
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 15000
