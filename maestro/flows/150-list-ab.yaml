# M1-PERFORMANCE-001: list engine A/B in ONE screen (FlashList and LegendList, 3 runs each, alternating, 300 synthetic bubbles). Numbers: tx_list_ab_* log lines.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- scrollUntilVisible:
    element:
      id: "profile-list-ab"
    timeout: 30000
- tapOn:
    id: "profile-list-ab"
- extendedWaitUntil:
    visible: "LISTAB DONE all"
    timeout: 240000
- takeScreenshot: 150-list-ab-done
