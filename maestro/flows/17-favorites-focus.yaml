# Favourites Focus: the conversation reduced to its favourite messages (header "…" menu), tap one to land on it in the chat.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Novidades.*"
    timeout: 60000
- tapOn: ".*Novidades.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Conversation options"
- takeScreenshot: 17-options-menu
- tapOn:
    text: "Favorites.*"
    optional: true
- extendedWaitUntil:
    visible:
      id: "favorites-focus"
    timeout: 10000
- takeScreenshot: 17-favorites-focus
- tapOn: ".*Marca B.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 10000
- takeScreenshot: 17-landed-on-message
