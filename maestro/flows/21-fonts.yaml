# Settings > Font: each packaged face previewed (cards + live preview), Apply, then the size slider and back to the system font (the choice is saved, so the flow restores it).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- tapOn: "Settings.*"
- extendedWaitUntil:
    visible:
      id: "font-options"
    timeout: 10000
- takeScreenshot: 21-settings-fonts
- swipe:
    from:
      id: "font-options"
    direction: LEFT
    optional: true
- tapOn:
    id: "font-option-lora"
- takeScreenshot: 21-lora
- swipe:
    from:
      id: "font-options"
    direction: LEFT
    optional: true
- takeScreenshot: 21-carousel-scrolled
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "font-option-inter"
          commands:
            - swipe:
                from:
                  id: "font-options"
                direction: RIGHT
      - assertVisible:
          id: "font-option-inter"
- tapOn:
    id: "font-option-inter"
- takeScreenshot: 21-inter
- scrollUntilVisible:
    element:
      id: "settings-apply"
    optional: true
- tapOn:
    id: "settings-apply"
    optional: true
- takeScreenshot: 21-inter-applied
# Home and the chat in a packaged face (the Composer input too): relaunch with Inter saved, look, then restore the system font.
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- takeScreenshot: 21-home-in-inter
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- takeScreenshot: 21-chat-in-inter
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- tapOn: "Settings.*"
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "font-option-system"
          commands:
            - swipe:
                from:
                  id: "font-options"
                direction: RIGHT
      - assertVisible:
          id: "font-option-system"
- tapOn:
    id: "font-option-system"
- scrollUntilVisible:
    element:
      id: "settings-apply"
    optional: true
- tapOn:
    id: "settings-apply"
    optional: true
- takeScreenshot: 21-back-to-system
