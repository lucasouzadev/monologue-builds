# Home > Activity calendar (a top Reveal; the header Calendar button and the pull-down share it): the year map is display only; the monthly calendar selects the day.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Activity calendar"
    timeout: 60000
- tapOn: "Activity calendar"
- extendedWaitUntil:
    visible:
      id: "activity-grid"
    timeout: 10000
- takeScreenshot: 22-activity
- tapOn:
    id: "activity-month-day-.*"
    optional: true
- takeScreenshot: 22-activity-day-selected
