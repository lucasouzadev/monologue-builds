# Profile > Activity: the year map is display only; the monthly calendar selects the day.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- tapOn: "Activity.*"
- extendedWaitUntil:
    visible:
      id: "activity-grid"
    timeout: 10000
- takeScreenshot: 22-activity
- tapOn:
    id: "activity-month-day-.*"
    optional: true
- takeScreenshot: 22-activity-day-selected
