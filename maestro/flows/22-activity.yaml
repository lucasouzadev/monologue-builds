# Home > Calendar (a top Reveal; the header Calendar button and the pull-down share it): the month calendar selects a day and lists what happened.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Activity calendar"
    timeout: 60000
- tapOn: "Activity calendar"
- extendedWaitUntil:
    visible:
      id: "activity-month-controls"
    timeout: 10000
- takeScreenshot: 22-activity
- tapOn:
    id: "activity-month-day-.*"
    optional: true
- takeScreenshot: 22-activity-day-selected
