# Home > Calendar (a top Reveal; the header Calendar button and the pull-down share it): the calendar the conversation used to have, across every
# conversation. A day with messages opens that day's first message.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Activity calendar"
    timeout: 60000
- tapOn: "Activity calendar"
- extendedWaitUntil:
    visible:
      id: "activity-month-controls"
    timeout: 10000
- takeScreenshot: 22-calendar
- assertVisible:
    id: "home-calendar-today"
- assertVisible:
    id: "home-calendar-done"
- tapOn:
    id: "home-calendar-done"
- takeScreenshot: 22-calendar-closed
