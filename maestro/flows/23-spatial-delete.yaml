# Spatial: "+" creates a throwaway conversation and selects it; the footer buttons (red Duplicate, red-title Delete) and the Delete balloon.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "More creation options"
    timeout: 60000
- tapOn: "More creation options"
- tapOn: "Timeline"
- extendedWaitUntil:
    visible: "Close conversation previews"
    timeout: 10000
- tapOn:
    id: "spatial-create"
- takeScreenshot: 23-spatial-footer
- tapOn: "Delete"
- extendedWaitUntil:
    visible:
      id: "callout"
    timeout: 10000
- takeScreenshot: 23-delete-balloon
# Tapping outside closes the balloon without deleting; ask again and confirm.
- tapOn:
    point: "50%,30%"
- takeScreenshot: 23-balloon-dismissed
- tapOn: "Delete"
- tapOn:
    id: "callout-action-delete"
    optional: true
- tapOn:
    point: "62%,84%"
    optional: true
- takeScreenshot: 23-after-delete
- tapOn:
    id: "spatial-close"
    optional: true
- tapOn:
    text: "Close conversation previews"
    optional: true
- takeScreenshot: 23-home-after-delete
- assertVisible: "Open personal space"
