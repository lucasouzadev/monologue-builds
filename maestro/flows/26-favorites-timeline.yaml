# The conversation Reveal's Favorites page (needs at least one favorite — flow 16 leaves one; otherwise it shows the empty line).
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*Ola.*"
    timeout: 60000
- tapOn: ".*Ola.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Conversation info"
- extendedWaitUntil:
    visible:
      id: "info-favorites"
    timeout: 15000
- tapOn:
    id: "info-favorites"
- takeScreenshot: 26-favorites-page
- tapOn:
    id: "favorites-back"
- takeScreenshot: 26-back-to-info
