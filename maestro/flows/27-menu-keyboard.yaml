# Owner bug (2026-10-08): long-press a message that clings to the composer while the keyboard is open — the lifted message flies over the
# content, then falls slightly and the menu falls with it. Frames right after the press show whether the geometry moves after opening.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*(Novidades|Veja|Ola).*"
    timeout: 60000
- tapOn: ".*(Novidades|Veja|Ola).*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Message.*"
- takeScreenshot: 27-keyboard-open
- longPressOn: ".*(Veja|Ola).*"
- takeScreenshot: 27-menu-frame-1
- takeScreenshot: 27-menu-frame-2
- takeScreenshot: 27-menu-frame-3
- extendedWaitUntil:
    visible: ".*(Copy|Copiar).*"
    timeout: 5000
- takeScreenshot: 27-menu-frame-4
- tapOn:
    point: "50%,10%"
    optional: true
- takeScreenshot: 27-menu-closed
