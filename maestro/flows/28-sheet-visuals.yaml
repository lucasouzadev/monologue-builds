# Owner QA 2026-10-09/10 — the conversation Reveal (info, Favorites, Pinned, dots) in light and dark via the audit passes.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ".*(Novidades|Veja|Ola).*"
    timeout: 60000
- tapOn: ".*(Novidades|Veja|Ola).*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- tapOn: "Conversation info"
- extendedWaitUntil:
    visible:
      id: "conversation-info-title"
    timeout: 15000
- takeScreenshot: 28-info-top
- tapOn:
    id: "info-pinned"
- takeScreenshot: 28-pinned-page
- tapOn:
    id: "pinned-back"
- tapOn:
    id: "info-favorites"
- takeScreenshot: 28-favorites-page
- tapOn:
    id: "favorites-back"
- swipe:
    start: "50%,62%"
    end: "50%,12%"
    duration: 400
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Back"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
