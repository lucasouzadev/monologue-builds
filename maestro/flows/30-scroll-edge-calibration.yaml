# Synthetic calibration only; the route remains absent from the product drawer.
# Native binding is necessary evidence, not visual/performance acceptance.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Monologue"
    timeout: 60000
- retry:
    maxRetries: 2
    commands:
      - openLink: "monologue:///__diagnostics/scroll-edge"
      - runFlow:
          when:
            visible: "Open in.*Monologue.*"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible: "Desfoque progressivo"
          timeout: 60000
- takeScreenshot: 30-edge-registration
- takeScreenshot: 30-edge-calibration-top
# Evidence first: capture the header with coloured bands and fine text scrolled under it BEFORE the strict
# binding assertion, so a binding failure still leaves the pixels to inspect. The assertion below stays mandatory.
- swipe:
    start: 50%, 72%
    end: 50%, 38%
    duration: 600
- takeScreenshot: 30-edge-calibration-scrolled
- swipe:
    start: 50%, 72%
    end: 50%, 38%
    duration: 600
- takeScreenshot: 30-edge-calibration-scrolled-2
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "UIKit: lista e cabeçalho vinculados"
          timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Fallback: sem vínculo UIKit"
- tapOn: "Voltar"
