# M2 Rich Capture: the Keyboard Slot. Focus the composer, select text, open the formatting panel from the pill on the keyboard's edge, format, close it and send.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "Rico"
- tapOn: "Message.*"
- inputText: "alpha beta gamma"
- extendedWaitUntil:
    visible: "Formatting"
    timeout: 8000
- takeScreenshot: 36-pill
# A long press in the field offers "Select all" on both platforms.
- longPressOn: "alpha beta gamma"
- tapOn: "Select [Aa]ll"
- takeScreenshot: 36-selected
# iOS: the system selection menu (Cut, Copy, ...) opens over the tools pill; tap an empty spot of the timeline to dismiss it first.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,25%"
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Formatting"
      - extendedWaitUntil:
          visible: "Bold"
          timeout: 5000
- takeScreenshot: 36-panel
- tapOn: "Bold"
- tapOn: "Italic"
- takeScreenshot: 36-panel-formatted
- tapOn: "Close formatting"
- takeScreenshot: 36-keyboard-back
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "alpha beta gamma"
    timeout: 15000
- takeScreenshot: 36-sent-bubble
