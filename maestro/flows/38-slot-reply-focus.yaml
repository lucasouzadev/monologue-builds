# Keyboard Slot in Reply Focus (the Composer floats over the Thought Focus): pill, panel, formatted reply sent.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "SlotRep"
- retry:
    maxRetries: 3
    commands:
      - longPressOn: ".*QA root.*"
      - runFlow:
          when:
            platform: iOS
          commands:
            - runFlow:
                when:
                  notVisible: "Write.*"
                commands:
                  - longPressOn:
                      point: "82%,83%"
      - extendedWaitUntil:
          visible: "Write.*"
          timeout: 5000
- tapOn: "Write.*"
- tapOn: "Reply"
- tapOn: "Message.*"
- extendedWaitUntil:
    visible: "Formatting"
    timeout: 10000
- inputText: "reply alpha beta"
- takeScreenshot: 38-reply-pill
- longPressOn: "reply alpha beta"
- tapOn: "Select [Aa]ll"
- tapOn: "Formatting"
- extendedWaitUntil:
    visible: "Italic"
    timeout: 8000
- tapOn: "Italic"
- takeScreenshot: 38-reply-panel
- tapOn: "Close formatting"
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ".*reply alpha beta.*"
    timeout: 15000
- takeScreenshot: 38-reply-sent
