# Owner request 2026-10-09: first access is a simulated conversation (first thought -> try Continue / Reply / Select text -> storage choice).
# Opened on demand by deep link (the staging channel never shows it unprompted). Ends with "Decide later" so no folder picker is needed.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "New conversation"
    timeout: 60000
- openLink: "monologue:///onboarding"
- runFlow:
    when:
      visible: "Open in.*Monologue.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: ".*Write your first thought.*"
    timeout: 20000
- takeScreenshot: 41-onboarding-welcome
- tapOn:
    id: "onboarding-input"
- inputText: "Minha primeira ideia"
- takeScreenshot: 41-onboarding-typing
- tapOn:
    id: "onboarding-send"
- extendedWaitUntil:
    visible: ".*Saved. Try it.*"
    timeout: 10000
- tapOn:
    id: "onboarding-try-continue"
- tapOn:
    id: "onboarding-try-reply"
- tapOn:
    id: "onboarding-try-select"
- takeScreenshot: 41-onboarding-tour
- tapOn:
    id: "onboarding-next"
- extendedWaitUntil:
    visible: ".*Where should we keep.*"
    timeout: 10000
- assertVisible: ".*Cloud \\(coming soon\\).*"
- assertVisible: ".*Folder on this device.*"
- takeScreenshot: 41-onboarding-storage
- tapOn:
    id: "onboarding-later"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 25000
- assertVisible: ".*Minha primeira ideia.*"
- takeScreenshot: 41-onboarding-first-conversation
