# Owner QA 2026-10-09 #2: create a conversation in the Spatial overview, enter it, send a message, switch the keyboard layout —
# the Composer and the messages must stay above the keyboard. Evidence flow: screenshots are READ.
appId: app.monologue.mobile
env:
  QA_PREFIX: QA Spatial
---
- launchApp
# Home with no conversation has no creation tray: make one first, then go back to Home.
- runFlow: support/new-chat.yaml
- tapOn: "Back"
- extendedWaitUntil:
    visible: "More creation options"
    timeout: 60000
- tapOn: "More creation options"
- tapOn: "Timeline"
- extendedWaitUntil:
    visible: "Close conversation previews"
    timeout: 10000
- tapOn:
    id: "spatial-create"
- takeScreenshot: 50-spatial-created
- tapOn:
    id: "spatial-select-.*"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 25000
- takeScreenshot: 50-opened-from-spatial
- tapOn: "Message.*"
- inputText: "Primeira"
- tapOn: "Send message"
- assertVisible: ".*Primeira.*"
- takeScreenshot: 50-after-first-send
- inputText: "Segunda"
- tapOn: "Send message"
- assertVisible: ".*Segunda.*"
- takeScreenshot: 50-after-second-send
# The owner's recording: the keyboard layout switches (letters → numbers → symbols) and everything vanished behind it.
- tapOn:
    text: "123"
    optional: true
- takeScreenshot: 50-keyboard-numbers
- assertVisible: ".*Segunda.*"
- tapOn:
    text: "ABC"
    optional: true
- takeScreenshot: 50-keyboard-letters-again
- assertVisible: "Message.*"
