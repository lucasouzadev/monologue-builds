# M2 QA round 2: the formatting panel is one opaque surface (no conversation showing through between the Composer and the panel); the selection stays visible with the panel open.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "Painel"
- tapOn: "Message.*"
- inputText: "selecao visivel no painel"
- retry:
    maxRetries: 3
    commands:
      - longPressOn: "selecao visivel no painel"
      - tapOn: "Select [Aa]ll"
- takeScreenshot: 73-selected
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Format"
      - extendedWaitUntil:
          visible: "Bold"
          timeout: 5000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 73-panel-surface
- tapOn: "Underline"
- takeScreenshot: 73-panel-formatted
- tapOn:
    id: "selection-close"
- takeScreenshot: 73-keyboard-back
