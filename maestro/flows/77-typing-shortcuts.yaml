# Typing syntax: the symbols stay in the text while typing, drawn hidden, and the content is formatted in the compose (*bold* _italic_ ~strike~ `mono`, "# " / "## "
# titles, "> " quote, a ``` line opens a code block, "- " bullets that continue on Enter). Sending turns the symbols into formatting: the bubble shows the result and no symbol.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "Atalhos"
- tapOn: "Message.*"
- inputText: "*negrito* e _italico_ e ~tachado~ e `mono`"
- takeScreenshot: 77-compose-inline
- pressKey: Enter
- inputText: "# Titulo grande"
- takeScreenshot: 77-compose-heading
- pressKey: Enter
- inputText: "- primeiro"
- pressKey: Enter
- runFlow: support/pause.yaml
- inputText: "segundo"
- takeScreenshot: 77-compose-list
- pressKey: Enter
- runFlow: support/pause.yaml
- pressKey: Enter
- runFlow: support/pause.yaml
- inputText: "## Subtitulo"
- pressKey: Enter
- inputText: "> citacao"
- pressKey: Enter
- runFlow: support/pause.yaml
- inputText: "continua"
- pressKey: Enter
- runFlow: support/pause.yaml
- pressKey: Enter
- runFlow: support/pause.yaml
- inputText: "```"
- pressKey: Enter
- inputText: "codigo *igual*"
- pressKey: Enter
- inputText: "```"
- takeScreenshot: 77-compose-blocks
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ".*negrito.*"
    timeout: 15000
- takeScreenshot: 77-sent-bubble
- assertNotVisible: ".*\\*negrito.*"
- assertNotVisible: ".*# Titulo.*"
- assertNotVisible: ".*## Subtitulo.*"
- assertNotVisible: ".*> citacao.*"
