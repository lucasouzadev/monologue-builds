# Edit a message: the new text replaces the old one, survives leaving the chat, and cancelling keeps the original.
# Android only: the iOS native message menu is not reachable by Maestro (runbook).
# NOT YET RUN: authored without a simulator/emulator; verify on staging before relying on it.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          file: support/new-chat.yaml
          env:
            QA_PREFIX: "Edicao"
      - tapOn: "Message.*"
      - inputText: "Original wording"
      - tapOn: "Send message"
      - extendedWaitUntil:
          visible: ".*Original wording.*"
          timeout: 10000
      - longPressOn: ".*Original wording.*"
      - tapOn:
          text: "Write"
          optional: true
      - tapOn: "Edit"
      - assertVisible:
          id: "edit-bubble-cancel"
      # Cancelling keeps the original.
      - tapOn:
          id: "edit-bubble-cancel"
      - assertVisible: ".*Original wording.*"
      - longPressOn: ".*Original wording.*"
      - tapOn:
          text: "Write"
          optional: true
      - tapOn: "Edit"
      - assertVisible: "Save edit"
      - tapOn:
          id: "composer-input"
      - eraseText: 40
      - inputText: "Corrected wording"
      # The editor shows the new text before saving (isolates typing from saving).
      - assertVisible: ".*Corrected wording.*"
      - tapOn: "Save edit"
      - extendedWaitUntil:
          visible: ".*Corrected wording.*"
          timeout: 10000
      - assertNotVisible: ".*Original wording.*"
      - takeScreenshot: 90-edited
      # Persistence: leave the chat through Home and come back.
      - openLink: "monologue:///"
      - extendedWaitUntil:
          visible: ${".*" + output.qaTitle + ".*"}
          timeout: 20000
      - tapOn: ${"^" + output.qaTitle + ".*"}
      - extendedWaitUntil:
          visible: ".*Corrected wording.*"
          timeout: 15000
      - assertNotVisible: ".*Original wording.*"
      - takeScreenshot: 90-edit-persisted
