# Round 6 · item 1.3 — the bubble tail goes away ONLY while the message is long-pressed and comes back when the menu closes; scrolling never removes it.
# The tail is decoration (hidden from screen readers, and drawn inside the bubble shape on Android), so the driver cannot see it: its state is checked
# on the screenshots below (rest, after scroll, menu open, menu closed); the flow asserts the moments around it.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "R6Tail"
- assertVisible: ".*QA root.*"
- takeScreenshot: 90-tail-rest
# Scrolling the timeline must keep it.
- swipe:
    start: "50%,40%"
    end: "50%,70%"
    duration: 400
- swipe:
    start: "50%,70%"
    end: "50%,40%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: ".*QA root.*"
- takeScreenshot: 90-tail-after-scroll
# Long press: the tail is lifted with the bubble (hidden) while the menu is open.
- retry:
    maxRetries: 3
    commands:
      - longPressOn: ".*QA root.*"
      - runFlow:
          when:
            platform: iOS
          commands:
            - runFlow:
                when:
                  notVisible: "Select text"
                commands:
                  - longPressOn:
                      point: "82%,83%"
      - extendedWaitUntil:
          visible: "Select text"
          timeout: 5000
- takeScreenshot: 90-tail-menu-open
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,8%"
- extendedWaitUntil:
    notVisible: "Select text"
    timeout: 4000
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: ".*QA root.*"
- takeScreenshot: 90-tail-menu-closed
