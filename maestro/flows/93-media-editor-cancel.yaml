# #133 P0 (media lifecycle): a caption typed in the composer and a staged photo survive opening the photo editor and cancelling it.
# Tapping a photo in the composer tray opens the editor (media-editor), which shows the composer caption. Cancel must leave the tray and the caption exactly as they were,
# and sending afterwards must produce ONE photo bubble with the caption.
# Android PASS (run 39362318859); iOS selectors fixed after run 39363576131 (the import button was behind the keyboard coordinates).
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "Legenda"
- tapOn: "Message.*"
- inputText: "legenda da foto"
- tapOn: "Tools.*"
- extendedWaitUntil:
    visible: "Expand editor"
    timeout: 10000
- tapOn: "Photos"
# By label, not by point: with the keyboard open (the caption was typed) the panel sits above it on iOS, so the import button is at ~74% of the screen height and
# a tap at 86%,90% lands on the keyboard; and the tile at 55%,47% is the VIDEO there. Tile 2 is a photo on both platforms (the video is tile 5).
- tapOn: "(Photo|Foto) 2"
- tapOn: "(Import|Importar) 1"
# Named by id so a failure here says "the tray never appeared" (the later text check says "it did not come back").
- extendedWaitUntil:
    visible:
      id: "composer-attachment-tray"
    timeout: 20000
- assertVisible: ".*legenda da foto.*"
- takeScreenshot: 93-tray-with-caption
# Open the editor from the tray tile.
- tapOn:
    id: "tray-preview"
    index: 0
- extendedWaitUntil:
    visible:
      id: "media-editor"
    timeout: 10000
- assertVisible:
    id: "media-editor-caption"
- assertVisible: ".*legenda da foto.*"
- takeScreenshot: 93-editor-open
# Two levels of cancel. Draw mode has its own: cancelling there drops only that stroke and returns to the editor.
- tapOn:
    id: "media-editor-draw"
- extendedWaitUntil:
    visible:
      id: "media-editor-draw-mode"
    timeout: 10000
- swipe:
    start: "30%,45%"
    end: "70%,55%"
    duration: 400
- tapOn:
    id: "media-editor-draw-cancel"
- extendedWaitUntil:
    visible:
      id: "media-editor"
    timeout: 10000
- assertVisible: ".*legenda da foto.*"
# Draw again and apply the stroke; the editor's own cancel then discards the whole edit.
- tapOn:
    id: "media-editor-draw"
- swipe:
    start: "30%,45%"
    end: "70%,55%"
    duration: 400
- tapOn:
    id: "media-editor-draw-apply"
- extendedWaitUntil:
    visible:
      id: "media-editor"
    timeout: 10000
- takeScreenshot: 93-editor-drawn
- tapOn:
    id: "media-editor-cancel"
- extendedWaitUntil:
    notVisible:
      id: "media-editor"
    timeout: 10000
# The editor is a modal: on iOS the tray is reachable only after the dismiss animation ends.
- extendedWaitUntil:
    visible: "Attachments"
    timeout: 10000
- assertVisible: ".*legenda da foto.*"
- takeScreenshot: 93-after-cancel
# Send: one photo bubble with the caption, an empty tray.
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Photo.*"
    timeout: 20000
- assertVisible: ".*legenda da foto.*"
- assertNotVisible: "Attachments"
- takeScreenshot: 93-sent
