# Round 6 · item 13 (JS part) — the video viewer offers mute and playback speed in its tools pill. PiP and Edit video: 98b (native baseline 20).
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "R6Video"
- tapOn: "Tools.*"
- extendedWaitUntil:
    visible: "Photos"
    timeout: 10000
- tapOn: "Photos"
# The pushed clip is the newest item: the first tile.
- tapOn:
    point: "20%,47%"
- tapOn:
    point: "86%,90%"
- extendedWaitUntil:
    visible: "Attachments"
    timeout: 20000
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "(Video|Photo).*"
    timeout: 20000
- tapOn:
    text: "(Video|Photo).*"
    index: 0
- extendedWaitUntil:
    visible: "Close viewer"
    timeout: 10000
- takeScreenshot: 98-video-viewer
- assertVisible:
    id: "viewer-mute"
- assertVisible:
    id: "viewer-speed"
