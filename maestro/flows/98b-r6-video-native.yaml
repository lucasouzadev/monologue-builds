# Round 6 · item 13 (native part, baseline 20) — picture in picture and Edit video (trim with a frames bar). Expected to fail until baseline 20.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "R6VidNat"
- tapOn: "Tools.*"
- extendedWaitUntil:
    visible: "Photos"
    timeout: 10000
- tapOn: "Photos"
# The video fixture is the fifth tile (second row, middle): four generated PNGs come first (as in flow 70).
- tapOn:
    point: "50%,61%"
- tapOn:
    point: "86%,90%"
- extendedWaitUntil:
    visible: "Attachments"
    timeout: 20000
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Video.*"
    timeout: 20000
- tapOn:
    text: "Video.*"
    index: 0
- extendedWaitUntil:
    visible: "Close viewer"
    timeout: 10000
- takeScreenshot: 98b-video-viewer
- assertVisible:
    id: "viewer-mute"
- assertVisible:
    id: "viewer-speed"
- assertVisible:
    id: "viewer-pip"
- assertVisible:
    id: "viewer-edit-video"
