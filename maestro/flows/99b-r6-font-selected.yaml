# Round 6 · item 15 — Settings opens with the font in use already in view (no scrolling the carousel to find it). Restores the system font.
appId: app.monologue.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- tapOn: "Settings.*"
- extendedWaitUntil:
    visible:
      id: "font-options"
    timeout: 10000
- retry:
    maxRetries: 6
    commands:
      - runFlow:
          when:
            notVisible:
              id: "font-option-inter"
          commands:
            - swipe:
                from:
                  id: "font-options"
                direction: LEFT
- tapOn:
    id: "font-option-inter"
- tapOn:
    id: "settings-apply"
- waitForAnimationToEnd:
    timeout: 3000
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Open personal space"
    timeout: 60000
- tapOn: "Open personal space"
- tapOn: "Settings.*"
- extendedWaitUntil:
    visible:
      id: "font-options"
    timeout: 10000
- takeScreenshot: 99b-font-reopened
- assertVisible:
    id: "font-option-inter-check"
# Restore the system font for the flows that follow.
- retry:
    maxRetries: 6
    commands:
      - runFlow:
          when:
            notVisible:
              id: "font-option-system"
          commands:
            - swipe:
                from:
                  id: "font-options"
                direction: RIGHT
- tapOn:
    id: "font-option-system"
- tapOn:
    id: "settings-apply"
    optional: true
