# Owner QA 2026-11-12: the chat header collapses to its reading (lean) state while scrolling and the list "returns" while navigating. The numbers are the existing probe
# `tx_header_mode_ms` (ms = scroll offset at the flip, reading=1 lean / 0 normal, finger) plus `tx_dock_layout`; this flow only scrolls up and down a long chat.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "QA khead"
- extendedWaitUntil:
    visible: "Open in.*Monologue.*"
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: "Open in.*Monologue.*"
    commands:
      - tapOn: "Open"
- repeat:
    times: 22
    commands:
      - runFlow:
          when:
            visible: "Open in.*Monologue.*"
          commands:
            - tapOn: "Open"
      - tapOn: "Message.*"
      - inputText: "linha"
      - tapOn: "Send message"
- swipe:
    start: 50%, 40%
    end: 50%, 75%
- startRecording: k02-header-reading
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 600
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 600
      - takeScreenshot: k02-reading-up
      - swipe:
          start: 50%, 75%
          end: 50%, 30%
          duration: 600
      - takeScreenshot: k02-reading-down
- stopRecording
