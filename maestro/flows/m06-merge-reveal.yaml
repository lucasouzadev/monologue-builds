# platform: android
# M2-MOTION #8: the Merge reveal lifts with intermediate frames (it rose in one frame) and its band has rounded corners. Android only: the iOS native menu's
# Organize submenu is not reachable by Maestro.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "QA merge"
- tapOn: "Message.*"
- inputText: "Marca A"
- tapOn: "Send message"
- inputText: "Marca B"
- tapOn: "Send message"
- hideKeyboard
- longPressOn: ".*Marca B.*"
- tapOn:
    text: "Organi[sz]e.*"
    optional: true
- tapOn: "Merge"
- tapOn: ".*Marca A.*"
- startRecording: m06-merge-reveal
- tapOn: "Combine 2"
- extendedWaitUntil:
    visible: "Combine messages"
    timeout: 15000
- takeScreenshot: m06-merge-reveal
- stopRecording
- tapOn: "Combine messages"
- extendedWaitUntil:
    visible: "Message.*"
    timeout: 20000
- takeScreenshot: m06-merged
