# Chat-entry stress (owner 2026-10-24: the app slows down and breaks visually as it is used). Creates 3 chats, then opens and leaves them for 5 rounds (15 entries). The app's `tx_chat_open_*`
# numbers (tap on a Home row -> first list load) are printed per open: compare the first rounds with the last ones to see whether entering a chat degrades with use.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "QA s1"
- repeat:
    times: 4
    commands:
      - tapOn: "Message.*"
      - inputText: "linha de teste para o estresse"
      - tapOn: "Send message"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Message.*|.*QA s.*"
    timeout: 20000
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "QA s2"
- repeat:
    times: 4
