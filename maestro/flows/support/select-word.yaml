# Selects the first word in the Select-text bubble (Android: long press on it; iOS: double tap the field), and waits until the bubble counts the selection.
appId: app.monologue.mobile
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - longPressOn:
                point: "24%,47%"
      - runFlow:
          when:
            platform: iOS
          commands:
            - doubleTapOn:
                id: "text-selection-field"
      - extendedWaitUntil:
          visible: ".*characters selected.*"
          timeout: 3000
