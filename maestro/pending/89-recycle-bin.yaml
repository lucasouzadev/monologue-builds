# Recycle Bin: delete a fixture conversation from Home selection, find it in the bin, restore it.
# Uses its own fixture (support/new-chat.yaml), so the shared "Ola" state is untouched.
# NOT YET RUN: authored without a simulator/emulator; verify on staging before relying on it.
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "Lixeira"
- openLink: "monologue:///"
- runFlow:
    when:
      visible: "Open in.*Monologue.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: ${".*" + output.qaTitle + ".*"}
    timeout: 20000
- longPressOn: ${".*" + output.qaTitle + ".*"}
- tapOn:
    text: "Delete"
    optional: true
- extendedWaitUntil:
    visible:
      id: "conversation-selection-bar"
    timeout: 10000
- tapOn: "Delete 1"
- tapOn:
    id: "selection-confirm-action"
- assertNotVisible: ${".*" + output.qaTitle + ".*"}
- takeScreenshot: 89-deleted-from-home
- tapOn: "Filter conversations.*"
- tapOn: "Recycle Bin"
- extendedWaitUntil:
    visible:
      id: "trash-sheet"
    timeout: 10000
- assertVisible:
    id: "trash-note"
- assertVisible: ${".*" + output.qaTitle + ".*"}
- takeScreenshot: 89-in-bin
- tapOn:
    id: "trash-select"
- tapOn: ${".*" + output.qaTitle + ".*"}
- tapOn:
    id: "trash-select-restore"
- takeScreenshot: 89-after-restore
- tapOn:
    id: "trash-close"
- extendedWaitUntil:
    visible: ${".*" + output.qaTitle + ".*"}
    timeout: 15000
- takeScreenshot: 89-back-on-home
