# Recycle Bin: swipe a fixture conversation away (the gesture works on both platforms and asks nothing),
# find it in the bin, restore it, and see it back on Home. Own fixture via support/new-chat.yaml.
# (A row long-press is a preview on Android and a native menu on iOS, so it is not used here.)
appId: app.monologue.mobile
---
- launchApp
- runFlow:
    file: support/new-chat.yaml
    env:
      QA_PREFIX: "Lixeira"
- openLink: "monologue:///"
- runFlow:
    when:
      visible: "Open in.*Monologue.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: ${".*" + output.qaTitle + ".*"}
    timeout: 20000
- swipe:
    from:
      text: ${".*" + output.qaTitle + ".*"}
    direction: RIGHT   # the delete gesture is a swipe to the right (swipe-to-delete.tsx: activeOffsetX 12, failOffsetX -10)
# A full swipe may already complete the deletion; a half swipe leaves the button to tap.
- tapOn:
    id: "swipe-delete-action"
    optional: true
- extendedWaitUntil:
    notVisible: ${".*" + output.qaTitle + ".*"}
    timeout: 10000
- takeScreenshot: 89-deleted-from-home
- tapOn: "Filter conversations.*"
- tapOn: "Recycle Bin"
- extendedWaitUntil:
    visible:
      id: "trash-sheet"
    timeout: 10000
- assertVisible:
    id: "trash-note"
- assertVisible: ${".*" + output.qaTitle + ".*"}
- takeScreenshot: 89-in-bin
- tapOn:
    id: "trash-select"
- tapOn: ${".*" + output.qaTitle + ".*"}
- tapOn:
    id: "trash-select-restore"
- takeScreenshot: 89-after-restore
- tapOn:
    id: "trash-close"
- extendedWaitUntil:
    visible: ${".*" + output.qaTitle + ".*"}
    timeout: 15000
- takeScreenshot: 89-back-on-home
