# Stress, Android flavour (the app is already on the lab route, see android-e2e.sh). (iOS simulator and Android emulator jobs; the lab is on for the development update channel). The lab creates a conversation and
# sends one limit-sized (10k-char) message, 300 short messages as fast as the JS thread allows, then another limit-sized message, through the
# real conversation screen; the on-screen report carries send latency percentiles and the worst JS-thread stall.
appId: app.monologue.mobile
---
# (android-e2e.sh cold-starts the app straight on the lab route with `am start`; Maestro's openLink did not route on Android.)
- takeScreenshot: stress-00-start
- extendedWaitUntil:
    visible: "STRESS DONE.*"
    timeout: 300000
- takeScreenshot: stress-01-report
# Reply Focus on a message of a very long conversation.
- longPressOn: ".*wall two.*"
- takeScreenshot: stress-02-message-menu
- tapOn:
    text: "Reply"
    optional: true
- takeScreenshot: stress-03-reply-focus
- tapOn:
    text: "Done|Close.*"
    optional: true
# Scroll back through history quickly (pages older messages in while scrolling).
- repeat:
    times: 8
    commands:
      - swipe:
          start: "50%,35%"
          end: "50%,88%"
          duration: 120
- takeScreenshot: stress-04-scrolled-history
- assertVisible: "Back"
